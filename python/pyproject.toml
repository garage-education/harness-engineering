[project]
name = "harness"
version = "0.0.1"
description = "The Log Incident Watcher agent harness, in Python with LangChain."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.2",
    "langchain==1.4.3",
    "langchain-openai==1.6.7",
    "langgraph==1.2.12",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[project.scripts]
harness = "harness.harness_application:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.uv]
# Resolve every package, direct or transitive, to a release at least two weeks old.
exclude-newer = "2026-10-03T00:00:00Z"
